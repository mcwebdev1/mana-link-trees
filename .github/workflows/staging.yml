name: Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: node scripts/restore-binaries.mjs
      - name: Export the four link trees
        run: |
          set -euo pipefail
          mkdir -p site
          export STATIC_EXPORT=1
          export NEXT_BASE_PATH=/mana-link-trees/hubs
          npm run build -w mana-hubs
          mkdir -p site/hubs
          cp -a apps/hubs/out/. site/hubs/
          export NEXT_BASE_PATH=/mana-link-trees/common
          npm run build -w mana-common
          mkdir -p site/common
          cp -a apps/common/out/. site/common/
          export NEXT_BASE_PATH=/mana-link-trees/fashion
          npm run build -w mana-fashion
          mkdir -p site/fashion
          cp -a apps/fashion/out/. site/fashion/
          export NEXT_BASE_PATH=/mana-link-trees/tech
          npm run build -w mana-tech
          mkdir -p site/tech
          cp -a apps/tech/out/. site/tech/
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Mana link trees</title>
              <style>
                body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #161616; color: #fff; font-family: Helvetica, Arial, sans-serif; }
                main { width: min(420px, calc(100% - 48px)); }
                h1 { font-size: 28px; margin: 0 0 8px; }
                p { margin: 0 0 28px; color: #cfcfcf; }
                a { display: block; margin: 10px 0; padding: 14px 16px; border-radius: 999px; background: #fff; color: #161616; text-decoration: none; font-weight: 600; }
              </style>
            </head>
            <body>
              <main>
                <h1>Mana link trees</h1>
                <p>Staging proof for the team.</p>
                <a href="./hubs/">Mana Hubs</a>
                <a href="./common/">Mana Common</a>
                <a href="./fashion/">Mana Fashion</a>
                <a href="./tech/">Mana Tech</a>
              </main>
            </body>
          </html>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
